# Render Blueprint for the ForgeGuard AI backend (free web service: 0.1 CPU, 512 MB, sleeps after 15 min idle).
# Python version comes from .python-version (3.11). The key is entered in the Render dashboard, never here.
services:
  - type: web
    name: forgeguard-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_BASE_URL
        value: https://developer.amd.com.cn/radeon/api/v1
      - key: LLM_MODEL
        value: DeepSeek-V4-Flash
      - key: LLM_FALLBACK_MODEL
        value: MiMo-V2.6-Flash
      - key: LLM_HARDWARE_LABEL
        value: AMD GPUs - AMD Token Factory (Radeon Cloud)
      - key: LLM_TIMEOUT_S
        value: "60"
      - key: LLM_MAX_CASES
        value: "5"
      - key: LLM_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_ORIGIN_REGEX
        sync: false
